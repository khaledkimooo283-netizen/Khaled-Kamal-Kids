name: Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KK-Kids-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Prepare APK Asset for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/KK-Kids-v1.0.${{ github.run_number }}.apk

      - name: Create GitHub Release & Upload APK Asset
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: KK Kids Release v1.0.${{ github.run_number }}
          body: |
            ## 🦁 KK Kids Educational App Build
            - Direct **.apk** download available below under **Assets**.
            - Automatic build for release `v1.0.${{ github.run_number }}` on `${{ github.ref_name }}` branch.
            - Includes full suite of interactive preschool educational games, tracing engine, and natural teacher audio.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/KK-Kids-v1.0.${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
